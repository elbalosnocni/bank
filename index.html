<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cổng thi và khảo sát</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f6fb;min-height:100vh;padding:24px 10px}.quiz{max-width:900px;margin:auto;background:white;padding:clamp(18px,4vw,38px);border-radius:18px;box-shadow:0 8px 32px #14285012}.qcard{border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin:0 0 18px}.qimg,.optimg{max-width:100%;max-height:300px;object-fit:contain;display:block;margin:12px auto;border-radius:8px}.optimg{max-height:150px;margin:8px 0}.option{display:block;padding:10px;border-radius:8px;cursor:pointer}.option:hover{background:#f2f6ff}.timer{position:sticky;top:8px;z-index:5}</style></head><body><main class="quiz"><section id="setup"><h2 class="text-center text-primary fw-bold mb-4">CỔNG THI TRỰC TUYẾN</h2><div id="status" class="alert alert-info d-none"></div><label class="form-label fw-semibold">Họ và tên nhân viên</label><div class="position-relative mb-3"><input id="studentName" autocomplete="off" class="form-control form-control-lg" maxlength="150" placeholder="Nhập họ tên, mã nhân viên, bộ phận, phòng ban hoặc chức vụ"><input id="employeeId" type="hidden"><div id="employeeSuggestions" class="list-group position-absolute w-100 shadow d-none" style="z-index:20;max-height:260px;overflow:auto"></div><div id="employeeInfo" class="form-text"></div></div><label class="form-label fw-semibold">Môn thi / khảo sát</label><select id="monHoc" class="form-select form-select-lg mb-4"><option>Đang tải...</option></select><button id="startBtn" class="btn btn-primary btn-lg w-100" onclick="startExam()">Bắt đầu</button></section><section id="exam" class="d-none"><div class="d-flex justify-content-between gap-2 align-items-center border-bottom pb-3 mb-3"><h4 id="title" class="fw-bold m-0"></h4><span id="mode" class="badge text-bg-primary"></span></div><div id="timer" class="alert alert-danger text-center fw-bold timer d-none"></div><div id="questions"></div><button id="submit" class="btn btn-success btn-lg w-100" onclick="submitExam(false)">Gửi bài</button></section><section id="done" class="d-none text-center py-4"><h2 class="text-success">Đã gửi thành công</h2><div id="result" class="alert alert-success mt-3"></div><button class="btn btn-outline-primary" onclick="location.reload()">Quay lại</button></section></main><script>
const GAS_URL="https://script.google.com/macros/s/AKfycbxD0yFGCV4pEVpChSkK_xlpdhBRJWZzRP5_WTXyr32HILn8BPNz87kVKMLOFZ0Lze-7/exec";let questions=[],token='',name='',subject='',mode='GRADED',timerId=null,busy=false,employeeLookupEnabled=false,lookupTimer=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(p){const u=new URL(GAS_URL);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u);return r.json()}async function post(p){const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});return r.json()}
function status(t,type='info'){$('status').className='alert alert-'+type;$('status').textContent=t}
function img(url,alt,cls){if(!url)return '';return `<img class="${cls}" src="${esc(url)}" alt="${esc(alt)}" loading="lazy" onerror="this.outerHTML='<div class=\'small text-danger\'>Không tải được hình ảnh. Kiểm tra quyền chia sẻ hoặc URL ảnh.</div>'">`}
async function init(){try{const d=await get({action:'getSubjects'});if(d.status!=='success')throw Error(d.message);$('monHoc').innerHTML='<option value="">-- Chọn --</option>'+d.subjects.map(s=>`<option>${esc(s)}</option>`).join('');const emp=await get({action:'lookupEmployee',q:''});employeeLookupEnabled=!!emp.enabled;if(employeeLookupEnabled){$('studentName').placeholder='Nhập họ tên, mã nhân viên, bộ phận, phòng ban hoặc chức vụ';$('employeeInfo').textContent='Chọn đúng họ tên trong danh sách gợi ý để xác nhận bộ phận, phòng ban và chức vụ.'}if(!d.subjects.length)status('Chưa có môn học.','warning')}catch(e){status(e.message,'danger')}}document.addEventListener('DOMContentLoaded',init);
$('studentName').addEventListener('input',()=>{const q=$('studentName').value.trim();$('employeeId').value='';$('employeeInfo').textContent=employeeLookupEnabled?'Đang tìm nhân viên...':'';$('employeeSuggestions').classList.add('d-none');clearTimeout(lookupTimer);if(!employeeLookupEnabled||q.length<2)return;lookupTimer=setTimeout(async()=>{try{const d=await get({action:'lookupEmployee',q});const box=$('employeeSuggestions');box.innerHTML=d.employees.map(e=>`<button type="button" class="list-group-item list-group-item-action" data-id="${esc(e.maNhanVien)}"><b>${esc(e.hoTen)}</b> <span class="text-secondary small">(${esc(e.maNhanVien)})</span><div class="small text-secondary">${esc(e.boPhan)} · ${esc(e.phongBan)} · ${esc(e.chucVu)}</div></button>`).join('')||'<div class="list-group-item text-secondary">Không tìm thấy nhân viên phù hợp.</div>';box.classList.remove('d-none');box.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{const e=d.employees.find(x=>x.maNhanVien===b.dataset.id);$('studentName').value=e.hoTen;$('employeeId').value=e.maNhanVien;$('employeeInfo').textContent=[e.boPhan,e.phongBan,e.chucVu].filter(Boolean).join(' · ');box.classList.add('d-none')})}catch(e){$('employeeInfo').textContent='Không tra cứu được danh sách nhân viên: '+e.message}},250)});
async function startExam(){name=$('studentName').value.trim();subject=$('monHoc').value;if(!name||!subject){status('Vui lòng nhập họ tên và chọn môn.','warning');return}if(employeeLookupEnabled&&!$('employeeId').value){status('Vui lòng chọn họ tên từ danh sách nhân viên gợi ý.','warning');return}$('startBtn').disabled=true;try{const d=await get({action:'getExam',monHoc:subject});if(d.status!=='success')throw Error(d.message);questions=d.questions;token=d.token;mode=d.config.mode;$('setup').classList.add('d-none');$('exam').classList.remove('d-none');$('title').textContent=subject;$('mode').textContent=mode==='OPINION'?'KHẢO SÁT – KHÔNG CHẤM ĐIỂM':'BÀI THI – CÓ CHẤM ĐIỂM';render();timer(+d.config.thoiGian||0)}catch(e){status(e.message,'danger');$('startBtn').disabled=false}}
function render(){const root=$('questions');root.innerHTML='';questions.forEach((q,i)=>{const card=document.createElement('article');card.className='qcard';let h=`<h5 class="fw-semibold">Câu ${i+1}. ${esc(q.question)}</h5>${q.category?`<div class="mb-2"><span class="badge text-bg-light border">${esc(q.category)}</span></div>`:''}${img(q.image,'Hình câu hỏi','qimg')}`;if(q.type==='MULTI_FIELD'){h+=`<div class="mt-3">${(q.fields||[]).map((f,j)=>`<div class="mb-3"><label class="form-label fw-semibold">${j+1}. ${esc(f.label||f)}${f.required?' *':''}</label><textarea class="form-control" rows="3" maxlength="5000" name="q_${esc(q.id)}_f${j}" ${f.required?'data-required="1"':''} placeholder="Nhập nội dung..."></textarea></div>`).join('')}<div class="form-check mt-2"><input class="form-check-input" type="checkbox" id="q_${esc(q.id)}_noOpinion" name="q_${esc(q.id)}_noOpinion"><label class="form-check-label" for="q_${esc(q.id)}_noOpinion">Tôi không có ý kiến</label></div></div>`}else if(q.type==='ESSAY')h+=`<textarea class="form-control mt-3" rows="5" maxlength="5000" name="q_${esc(q.id)}" placeholder="Nhập câu trả lời..."></textarea>`;else if(q.type==='FILL_BLANK')h+=`<input class="form-control mt-3" maxlength="1000" name="q_${esc(q.id)}" placeholder="Nhập câu trả lời">`;else{const multi=q.type==='MULTI_SELECT';h+=(q.options||[]).map(o=>`<label class="option"> <input class="form-check-input me-2" type="${multi?'checkbox':'radio'}" name="q_${esc(q.id)}" value="${esc(o.value)}"> <b>${esc(o.value)}.</b> ${esc(o.text)} ${img(o.image,'Hình phương án','optimg')}</label>`).join('')}card.innerHTML=h;root.appendChild(card);if(q.type==='MULTI_FIELD'){const no=$(`q_${q.id}_noOpinion`);no?.addEventListener('change',()=>card.querySelectorAll('textarea').forEach(t=>{t.disabled=no.checked;if(no.checked)t.value=''}))}})}
function timer(min){if(!min)return;let n=min*60;$('timer').classList.remove('d-none');const tick=()=>{$('timer').textContent=`Thời gian còn lại: ${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;if(n--<=0){clearInterval(timerId);submitExam(true)}};tick();timerId=setInterval(tick,1000)}
async function submitExam(auto){if(busy)return;if(!auto&&!confirm('Gửi câu trả lời?'))return;busy=true;if(timerId)clearInterval(timerId);$('submit').disabled=true;const answers={},meta={};questions.forEach(q=>{const els=[...document.querySelectorAll(`[name="q_${CSS.escape(String(q.id))}"]`)];if(q.type==='MULTI_SELECT')answers[q.id]=els.filter(x=>x.checked).map(x=>x.value);else if(q.type==='MULTI_FIELD'){const obj={__noOpinion:!!$(`q_${q.id}_noOpinion`)?.checked};(q.fields||[]).forEach((f,j)=>obj['f'+j]=document.querySelector(`[name="q_${CSS.escape(String(q.id))}_f${j}"]`)?.value||'');answers[q.id]=obj}else if(['ESSAY','FILL_BLANK'].includes(q.type))answers[q.id]=els[0]?.value||'';else answers[q.id]=els.find(x=>x.checked)?.value||'';meta[q.id]={question:q.question}});$('questions').textContent='Đang gửi dữ liệu...';try{const d=await post({action:'submitExam',token,studentName:name,employeeId:$('employeeId').value,answers,questionMeta:meta});if(d.status!=='success')throw Error(d.message);$('exam').classList.add('d-none');$('done').classList.remove('d-none');$('result').textContent=d.mode==='OPINION'?'Cảm ơn bạn đã đóng góp ý kiến.':`Họ tên: ${name} | Số câu đúng: ${d.score}/${d.total} | Điểm: ${Number(d.diemSo).toFixed(2)}/10. Các câu tự luận cần giáo viên chấm riêng.`}catch(e){busy=false;$('submit').disabled=false;$('questions').textContent=e.message+' Hãy thử gửi lại, không tải lại trang.'}}
</script></body></html>
