<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cổng thi và khảo sát</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f3f6fb;min-height:100vh;padding:24px 10px}.quiz{max-width:900px;margin:auto;background:white;padding:clamp(18px,4vw,38px);border-radius:18px;box-shadow:0 8px 32px #14285012}.qcard{border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin:0 0 18px}.qimg,.optimg{max-width:100%;max-height:300px;object-fit:contain;display:block;margin:12px auto;border-radius:8px}.optimg{max-height:150px;margin:8px 0}.option{display:block;padding:10px;border-radius:8px;cursor:pointer}.option:hover{background:#f2f6ff}.timer{position:sticky;top:8px;z-index:5}</style></head><body><main class="quiz"><section id="setup"><h2 class="text-center text-primary fw-bold mb-4">CỔNG THI TRỰC TUYẾN</h2><div id="status" class="alert alert-info d-none"></div><label class="form-label fw-semibold">Số căn cước công dân</label><div class="input-group input-group-lg mb-2"><input id="cccd" type="password" inputmode="numeric" autocomplete="off" maxlength="12" class="form-control" placeholder="Nhập đủ 12 chữ số căn cước"><button class="btn btn-outline-secondary" type="button" id="toggleCccd" aria-label="Hiện hoặc ẩn số căn cước" onclick="toggleCccd()"><span id="eyeIcon">Hiện</span></button></div><div class="form-text mb-3">Số căn cước được dùng để xác thực. Hệ thống chỉ lưu mã băm, không lưu số căn cước gốc.</div><button id="lookupBtn" class="btn btn-outline-primary w-100 mb-3" onclick="lookupEmployee()">Tra cứu thông tin và bài được phân công</button><div id="employeeInfo" class="alert alert-success d-none"></div><label class="form-label fw-semibold">Bài thi / khảo sát được phân công</label><select id="monHoc" class="form-select form-select-lg mb-4" disabled><option>Tra cứu căn cước trước</option></select><button id="startBtn" class="btn btn-primary btn-lg w-100" onclick="startExam()" disabled>Bắt đầu</button></section><section id="exam" class="d-none"><div class="d-flex justify-content-between gap-2 align-items-center border-bottom pb-3 mb-3"><h4 id="title" class="fw-bold m-0"></h4><span id="mode" class="badge text-bg-primary"></span></div><div id="timer" class="alert alert-danger text-center fw-bold timer d-none"></div><div class="mb-3 p-3 border rounded-3 bg-light"><div class="d-flex justify-content-between small mb-1"><span>Tiến độ hoàn thành</span><b id="progressText">0%</b></div><div class="progress" role="progressbar" aria-label="Tiến độ bài làm"><div id="progressBar" class="progress-bar progress-bar-striped" style="width:0%"></div></div><div id="progressCount" class="small text-secondary mt-1">0/0 câu đã trả lời</div></div><div id="questions"></div><button id="submit" class="btn btn-success btn-lg w-100" onclick="submitExam(false)">Gửi bài</button></section><section id="done" class="d-none text-center py-4"><h2 class="text-success">Đã gửi thành công</h2><div id="result" class="alert alert-success mt-3"></div><button class="btn btn-outline-primary" onclick="location.reload()">Quay lại</button></section></main><script>
const GAS_URL="DAN_URL_WEB_APP_GAS_CUA_BAN_VAO_DAY";let questions=[],token='',employeeToken='',name='',subject='',mode='GRADED',timerId=null,busy=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(p){const u=new URL(GAS_URL);Object.entries(p).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u);return r.json()}async function post(p){const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});return r.json()}
function status(t,type='info'){$('status').className='alert alert-'+type;$('status').textContent=t}
function toggleCccd(){const x=$('cccd');x.type=x.type==='password'?'text':'password';$('eyeIcon').textContent=x.type==='password'?'Hiện':'Ẩn'}
function init(){$('monHoc').innerHTML='<option value="">-- Tra cứu căn cước trước --</option>'}document.addEventListener('DOMContentLoaded',init);
async function lookupEmployee(){const cccd=$('cccd').value.replace(/\s/g,'');if(!/^\d{12}$/.test(cccd)){status('Số căn cước phải gồm đúng 12 chữ số.','warning');return}$('lookupBtn').disabled=true;$('lookupBtn').textContent='Đang xác thực...';try{const d=await post({action:'employeeLookup',cccd});if(d.status!=='success')throw Error(d.message);employeeToken=d.employeeToken;name=d.employee.hoTen;$('employeeInfo').classList.remove('d-none');$('employeeInfo').innerHTML=`<b>Đã xác thực nhân viên</b><br>${esc(d.employee.hoTen)}<br>Mã nhân viên: ${esc(d.employee.maNhanVien)}<br>Bộ phận: ${esc(d.employee.boPhan)}<br>Phòng ban: ${esc(d.employee.phongBan)}<br>Chức vụ: ${esc(d.employee.chucVu)}`;$('monHoc').disabled=false;$('monHoc').innerHTML=(d.exams||[]).length?'<option value="">-- Chọn bài được phân công --</option>'+d.exams.map(x=>`<option value="${esc(x.monHoc)}" ${x.status!=='OPEN'?'disabled':''}>${esc(x.monHoc)} · ${x.mode==='OPINION'?'Khảo sát':'Bài thi'} · ${x.status==='OPEN'?'Đang mở':x.status==='SCHEDULED'?'Chưa đến giờ':x.status==='EXPIRED'?'Đã hết hạn':'Đã đóng'}</option>`).join(''):'<option value="">Chưa được phân công bài thi/khảo sát</option>';$('startBtn').disabled=true;status((d.exams||[]).length?'Xác thực thành công. Danh sách chỉ gồm bài được phân công; chỉ bài đang mở mới bắt đầu được.':'Đã xác thực nhân viên nhưng hiện chưa có bài thi/khảo sát được phân công.','success')}catch(e){employeeToken='';name='';$('employeeInfo').classList.add('d-none');$('monHoc').disabled=true;$('monHoc').innerHTML='<option>Tra cứu căn cước trước</option>';$('startBtn').disabled=true;status(e.message,'danger')}finally{$('lookupBtn').disabled=false;$('lookupBtn').textContent='Tra cứu thông tin và bài được phân công'}}
$('monHoc').addEventListener('change',()=>{$('startBtn').disabled=!employeeToken||!$('monHoc').value||$('monHoc').selectedOptions[0]?.disabled});$('cccd').addEventListener('input',()=>{employeeToken='';name='';$('employeeInfo').classList.add('d-none');$('monHoc').disabled=true;$('monHoc').innerHTML='<option>Tra cứu căn cước trước</option>';$('startBtn').disabled=true});
async function startExam(){subject=$('monHoc').value;if(!employeeToken||!name||!subject){status('Vui lòng tra cứu căn cước và chọn bài được phân công.','warning');return}$('startBtn').disabled=true;try{const d=await post({action:'getExam',monHoc:subject,employeeToken});if(d.status!=='success')throw Error(d.message);questions=d.questions;token=d.token;mode=d.config.mode;window.totalAnswerQuestions=Number(d.config.questionCount)||questions.filter(q=>!q.isHeading).length;$('setup').classList.add('d-none');$('exam').classList.remove('d-none');$('title').textContent=subject;$('mode').textContent=mode==='OPINION'?'KHẢO SÁT – KHÔNG CHẤM ĐIỂM':'BÀI THI – CÓ CHẤM ĐIỂM';render();timer(+d.config.thoiGian||0)}catch(e){status(e.message,'danger');$('startBtn').disabled=false}}
function img(url,alt,cls){if(!url)return '';return `<img class="${cls}" src="${esc(url)}" alt="${esc(alt)}" loading="lazy" onerror="this.outerHTML='<div class=\'small text-danger\'>Không tải được hình ảnh. Kiểm tra quyền chia sẻ hoặc URL ảnh.</div>'">`}
function render(){
 const root=$('questions');root.innerHTML='';let questionNo=0,letterNo=0,romanNo=0;
 const roman=n=>{const vals=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let out='';vals.forEach(([v,s])=>{while(n>=v){out+=s;n-=v}});return out};
 questions.forEach((q,i)=>{
  if(q.isHeading||q.type==='SECTION'){
   const style=q.headingStyle||q.settings?.sectionStyle||'TITLE';let prefix='';if(style==='LETTER')prefix=String.fromCharCode(65+(letterNo++%26))+'. ';else if(style==='ROMAN')prefix=roman(++romanNo)+'. ';
   const heading=document.createElement('div');heading.className='section-heading my-4 p-3 rounded-3 border-start border-4 border-primary bg-light';heading.innerHTML=`<h4 class="m-0 fw-bold">${prefix}${esc(q.question)}</h4>`;root.appendChild(heading);return;
  }
  questionNo++;const card=document.createElement('article');card.className='qcard';let h=`<h5 class="fw-semibold">Câu ${questionNo}. ${esc(q.question)}</h5>${q.category?`<div class="mb-2"><span class="badge text-bg-light border">${esc(q.category)}</span></div>`:''}${img(q.image,'Hình câu hỏi','qimg')}`;const nm=`q_${esc(q.id)}`,opts=q.options||[],settings=q.settings||{};
  if(q.type==='MULTI_FIELD'){h+=`<div class="mt-3">${(q.fields||[]).map((f,j)=>`<div class="mb-3"><label class="form-label fw-semibold">${j+1}. ${esc(f.label||f)}${f.required?' *':''}</label><textarea class="form-control" rows="3" maxlength="5000" name="${nm}_f${j}" ${f.required?'data-required="1"':''} placeholder="Nhập nội dung..."></textarea></div>`).join('')}<div class="form-check mt-2"><input class="form-check-input" type="checkbox" id="${nm}_noOpinion" name="${nm}_noOpinion"><label class="form-check-label" for="${nm}_noOpinion">Tôi không có ý kiến</label></div></div>`}
  else if(q.type==='ESSAY')h+=`<textarea class="form-control mt-3" rows="5" maxlength="5000" name="${nm}" placeholder="Nhập câu trả lời..."></textarea>`;
  else if(q.type==='SHORT_TEXT'){const numeric=settings.inputType==='number';h+=`<input class="form-control mt-3" type="text" ${numeric?'inputmode="numeric" pattern="[0-9]*"':''} ${numeric&&settings.minValue!=null?`min="${Number(settings.minValue)}"`:''} ${numeric&&settings.maxValue!=null?`max="${Number(settings.maxValue)}"`:''} ${`maxlength="${Math.max(1,Math.min(5000,Number(settings.maxLength)||500))}"`} name="${nm}" placeholder="${numeric?'Chỉ nhập số...':'Nhập câu trả lời ngắn...'}">`}
  else if(q.type==='FILL_BLANK')h+=`<input class="form-control mt-3" maxlength="1000" name="${nm}" placeholder="Nhập câu trả lời">`;
  else if(q.type==='DATE')h+=`<input class="form-control mt-3" type="date" name="${nm}">`;
  else if(q.type==='TIME')h+=`<input class="form-control mt-3" type="time" name="${nm}">`;
  else if(q.type==='DROPDOWN')h+=`<select class="form-select mt-3" name="${nm}"><option value="">-- Chọn một phương án --</option>${opts.map(o=>`<option value="${esc(o.value)}">${esc(o.text)}</option>`).join('')}</select>`;
  else if(q.type==='LINEAR_SCALE'||q.type==='RATING'){const min=Number(settings.min??1),max=Number(settings.max??(q.type==='RATING'?5:5));h+=`<div class="d-flex flex-wrap gap-3 mt-3 align-items-center">${Array.from({length:max-min+1},(_,j)=>min+j).map(v=>`<label class="text-center border rounded p-2"><input class="form-check-input d-block mx-auto mb-1" type="radio" name="${nm}" value="${v}"><span>${q.type==='RATING'?'★'.repeat(v):v}</span></label>`).join('')}</div><div class="d-flex justify-content-between text-secondary small"><span>${esc(settings.minLabel||'')}</span><span>${esc(settings.maxLabel||'')}</span></div>`}
  else if(q.type==='MULTIPLE_CHOICE_GRID'||q.type==='CHECKBOX_GRID'){const rows=settings.rows||[];h+=`<div class="table-responsive mt-3"><table class="table table-bordered align-middle"><thead><tr><th></th>${opts.map(o=>`<th class="text-center">${esc(o.text)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,j)=>`<tr><th>${esc(r)}</th>${opts.map(o=>`<td class="text-center"><input class="form-check-input" type="${q.type==='CHECKBOX_GRID'?'checkbox':'radio'}" name="${nm}_r${j}" value="${esc(o.text)}" aria-label="${esc(r)} – ${esc(o.text)}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
  else{const multi=q.type==='MULTI_SELECT';h+=(opts||[]).map(o=>`<label class="option"> <input class="form-check-input me-2" type="${multi?'checkbox':'radio'}" name="${nm}" value="${esc(o.value)}"> <b>${esc(o.value)}.</b> ${esc(o.text)} ${img(o.image,'Hình phương án','optimg')}</label>`).join('')}
  card.innerHTML=h;root.appendChild(card);
  if(q.type==='MULTI_FIELD'){const no=$(`${'q_'+q.id}_noOpinion`);no?.addEventListener('change',()=>card.querySelectorAll('textarea').forEach(t=>{t.disabled=no.checked;if(no.checked)t.value=''}))}
 });
 root.addEventListener('input',updateProgress);root.addEventListener('change',updateProgress);updateProgress();
}
function updateProgress(){const qs=questions.filter(q=>!q.isHeading&&q.type!=='SECTION'),total=qs.length;let done=0;qs.forEach(q=>{const base=`q_${CSS.escape(String(q.id))}`;let answered=false;if(q.type==='MULTI_FIELD'){answered=!!document.getElementById(base+'_noOpinion')?.checked||(q.fields||[]).some((f,i)=>String(document.querySelector(`[name="${base}_f${i}"]`)?.value||'').trim())}else if(q.type==='MULTIPLE_CHOICE_GRID'||q.type==='CHECKBOX_GRID'){answered=(q.settings?.rows||[]).some((r,i)=>[...document.querySelectorAll(`[name="${base}_r${i}"]`)].some(x=>x.checked))}else{const els=[...document.querySelectorAll(`[name="${base}"]`)];answered=els.some(x=>x.type==='radio'||x.type==='checkbox'?x.checked:String(x.value||'').trim()!=='')}if(answered)done++});const pct=total?Math.round(done/total*100):0;$('progressBar').style.width=pct+'%';$('progressText').textContent=pct+'%';$('progressCount').textContent=done+'/'+total+' câu đã trả lời'}
async function submitExam(auto){if(busy)return;if(!auto&&!confirm('Gửi câu trả lời?'))return;busy=true;if(timerId)clearInterval(timerId);$('submit').disabled=true;const answers={},meta={};questions.forEach(q=>{const els=[...document.querySelectorAll(`[name="q_${CSS.escape(String(q.id))}"]`)];if(q.type==='MULTI_SELECT')answers[q.id]=els.filter(x=>x.checked).map(x=>x.value);else if(q.type==='MULTIPLE_CHOICE_GRID'||q.type==='CHECKBOX_GRID'){const rows=q.settings?.rows||[],obj={};rows.forEach((r,j)=>{const a=[...document.querySelectorAll(`[name="q_${CSS.escape(String(q.id))}_r${j}"]`)];obj['r'+j]=q.type==='CHECKBOX_GRID'?a.filter(x=>x.checked).map(x=>x.value):a.find(x=>x.checked)?.value||''});answers[q.id]=obj}else if(q.type==='MULTI_FIELD'){const obj={__noOpinion:!!$(`q_${q.id}_noOpinion`)?.checked};(q.fields||[]).forEach((f,j)=>obj['f'+j]=document.querySelector(`[name="q_${CSS.escape(String(q.id))}_f${j}"]`)?.value||'');answers[q.id]=obj}else if(['ESSAY','FILL_BLANK','SHORT_TEXT','DATE','TIME','DROPDOWN'].includes(q.type))answers[q.id]=els[0]?.value||'';else answers[q.id]=els.find(x=>x.checked)?.value||'';meta[q.id]={question:q.question}});$('questions').textContent='Đang gửi dữ liệu...';try{const d=await post({action:'submitExam',token,employeeToken,answers,questionMeta:meta});if(d.status!=='success')throw Error(d.message);$('exam').classList.add('d-none');$('done').classList.remove('d-none');$('result').textContent=d.mode==='OPINION'?'Cảm ơn bạn đã đóng góp ý kiến.':`Họ tên: ${name} | Số câu đúng: ${d.score}/${d.total} | Điểm: ${Number(d.diemSo).toFixed(2)}/10. Các câu tự luận cần giáo viên chấm riêng.`}catch(e){busy=false;$('submit').disabled=false;$('questions').textContent=e.message+' Hãy thử gửi lại, không tải lại trang.'}}
</script></body></html>
