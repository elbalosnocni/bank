<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cổng thi trực tuyến</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--primary:#2457c5}
body{background:#f3f6fb;min-height:100vh;padding:28px 12px}
.quiz-container{max-width:820px;margin:auto;background:#fff;padding:clamp(20px,4vw,40px);border-radius:18px;box-shadow:0 8px 32px rgba(20,40,80,.08)}
.question-img{max-width:100%;max-height:300px;object-fit:contain;display:block;margin:14px auto;border-radius:8px}
.timer-badge{position:sticky;top:10px;z-index:10;font-size:1.15rem}
.question-card{border:1px solid #e5eaf2;border-radius:12px;padding:18px;margin-bottom:18px}
.option{display:block;padding:10px 12px;border-radius:8px;cursor:pointer}
.option:hover{background:#f2f6ff}
#status{white-space:pre-line}
</style>
</head>
<body>
<div class="container">
  <div class="quiz-container">
    <div id="setup-screen">
      <h2 class="text-center fw-bold text-primary mb-4">CỔNG THI TRỰC TUYẾN</h2>
      <div id="status" class="alert alert-info d-none"></div>
      <div class="mb-3">
        <label for="studentName" class="form-label fw-semibold">Họ và tên thí sinh</label>
        <input id="studentName" class="form-control form-control-lg" maxlength="150" autocomplete="name" placeholder="Nhập họ và tên">
      </div>
      <div class="mb-4">
        <label for="monHoc" class="form-label fw-semibold">Môn thi</label>
        <select id="monHoc" class="form-select form-select-lg"><option value="">Đang tải danh sách môn thi...</option></select>
      </div>
      <button id="startBtn" class="btn btn-primary btn-lg w-100" onclick="startExam()">Bắt đầu làm bài</button>
    </div>

    <div id="exam-screen" class="d-none">
      <div class="d-flex justify-content-between align-items-center gap-3 border-bottom pb-3 mb-3">
        <h4 id="exam-title" class="m-0 fw-bold"></h4>
        <span id="exam-mode" class="badge text-bg-secondary p-2"></span>
      </div>
      <div id="timer-display" class="alert alert-danger text-center fw-bold timer-badge d-none"></div>
      <div id="questions-area"></div>
      <button id="submitBtn" class="btn btn-success btn-lg w-100 mt-3" onclick="submitExam(false)">Nộp bài thi</button>
    </div>

    <div id="result-screen" class="d-none text-center py-4">
      <h2 class="text-success fw-bold mb-3">Nộp bài thành công!</h2>
      <div id="result-text" class="alert alert-success"></div>
      <p class="text-muted">Kết quả đã được ghi vào trang tính KetQua.</p>
      <button class="btn btn-outline-primary mt-2" onclick="location.reload()">Quay lại trang chủ</button>
    </div>
  </div>
</div>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxD0yFGCV4pEVpChSkK_xlpdhBRJWZzRP5_WTXyr32HILn8BPNz87kVKMLOFZ0Lze-7/exec";
let examQuestions=[], currentMonHoc="", currentName="", examToken="", timerInterval=null, submitting=false;

document.addEventListener("DOMContentLoaded", loadSubjects);

async function apiGet(params){
  const url = new URL(GAS_URL);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const response = await fetch(url.toString());
  if(!response.ok) throw new Error("Không kết nối được máy chủ ("+response.status+").");
  return response.json();
}
async function apiPost(payload){
  // text/plain tránh yêu cầu CORS preflight của application/json.
  const response = await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  if(!response.ok) throw new Error("Không gửi được bài thi ("+response.status+").");
  return response.json();
}
function showStatus(message,type="info"){
  const el=document.getElementById("status");
  el.className="alert alert-"+type;
  el.textContent=message;
}
async function loadSubjects(){
  try{
    const data=await apiGet({action:"getSubjects"});
    const select=document.getElementById("monHoc");
    select.innerHTML='<option value="">-- Chọn môn thi --</option>';
    if(data.status!=="success") throw new Error(data.message||"Không tải được danh sách môn.");
    data.subjects.forEach(subject=>{
      const option=document.createElement("option");
      option.value=subject; option.textContent=subject; select.appendChild(option);
    });
    if(!data.subjects.length) showStatus("Chưa có môn thi. Giáo viên hãy thêm môn vào trang CaiDatDeThi.","warning");
  }catch(err){showStatus(err.message,"danger");}
}
async function startExam(){
  currentName=document.getElementById("studentName").value.trim();
  currentMonHoc=document.getElementById("monHoc").value;
  if(!currentName){showStatus("Vui lòng nhập họ và tên thí sinh.","warning");return;}
  if(!currentMonHoc){showStatus("Vui lòng chọn môn thi.","warning");return;}
  const btn=document.getElementById("startBtn"); btn.disabled=true;
  showStatus("Hệ thống đang tạo đề thi...");
  try{
    const res=await apiGet({action:"getExam",monHoc:currentMonHoc});
    if(res.status!=="success") throw new Error(res.message||"Không thể tạo đề.");
    examQuestions=res.questions||[]; examToken=res.token;
    document.getElementById("setup-screen").classList.add("d-none");
    document.getElementById("exam-screen").classList.remove("d-none");
    document.getElementById("exam-title").textContent=currentMonHoc;
    renderQuestions(); setupTimer(Number(res.config.thoiGian)||0);
  }catch(err){showStatus(err.message,"danger");btn.disabled=false;}
}
function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function renderQuestions(){
  const area=document.getElementById("questions-area");
  area.innerHTML="";
  examQuestions.forEach((q,index)=>{
    const card=document.createElement("section"); card.className="question-card";
    const heading=document.createElement("h5"); heading.className="fw-semibold"; heading.textContent=`Câu ${index+1}: ${q.question}`; card.appendChild(heading);
    if(q.image && /^https?:\/\//i.test(q.image)){
      const img=document.createElement("img"); img.src=q.image; img.alt="Hình minh họa câu hỏi"; img.className="question-img"; img.loading="lazy"; card.appendChild(img);
    }
    if(q.type==="FILL_BLANK"){
      const input=document.createElement("input"); input.type="text"; input.className="form-control"; input.name="q_"+q.id; input.placeholder="Nhập câu trả lời"; input.maxLength=500; card.appendChild(input);
    }else{
      [["A",q.a],["B",q.b],["C",q.c],["D",q.d]].forEach(([letter,value])=>{
        const label=document.createElement("label"); label.className="option";
        const radio=document.createElement("input"); radio.type="radio"; radio.name="q_"+q.id; radio.value=letter; radio.className="form-check-input me-2";
        label.appendChild(radio); label.appendChild(document.createTextNode(letter+". "+value)); card.appendChild(label);
      });
    }
    area.appendChild(card);
  });
}
function setupTimer(minutes){
  const mode=document.getElementById("exam-mode"), display=document.getElementById("timer-display");
  if(minutes<=0){mode.textContent="Không giới hạn thời gian";return;}
  mode.textContent="Có giới hạn thời gian";
  display.classList.remove("d-none");
  let remaining=minutes*60;
  const tick=()=>{
    const m=Math.floor(remaining/60),s=remaining%60;
    display.textContent=`Thời gian còn lại: ${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    if(remaining<=0){clearInterval(timerInterval);submitExam(true);return;}
    remaining--;
  };
  tick(); timerInterval=setInterval(tick,1000);
}
async function submitExam(autoSubmit=false){
  if(submitting)return;
  if(!autoSubmit&&!confirm("Bạn có chắc chắn muốn nộp bài thi?"))return;
  submitting=true;
  if(timerInterval)clearInterval(timerInterval);
  document.getElementById("submitBtn").disabled=true;
  document.getElementById("timer-display").classList.add("d-none");
  const answers={};
  examQuestions.forEach(q=>{
    if(q.type==="FILL_BLANK"){
      const input=document.querySelector(`[name="q_${CSS.escape(String(q.id))}"]`);
      answers[q.id]=input?input.value.trim():"";
    }else{
      const selected=document.querySelector(`input[name="q_${CSS.escape(String(q.id))}"]:checked`);
      answers[q.id]=selected?selected.value:"";
    }
  });
  document.getElementById("questions-area").textContent="Đang chấm điểm và lưu kết quả...";
  try{
    const result=await apiPost({action:"submitExam",token:examToken,studentName:currentName,answers});
    if(result.status!=="success")throw new Error(result.message||"Không thể lưu bài thi.");
    document.getElementById("exam-screen").classList.add("d-none");
    document.getElementById("result-screen").classList.remove("d-none");
    const grade=Number(result.diemSo != null ? result.diemSo : ((result.score / result.total * 10) || 0)).toFixed(2);
    document.getElementById("result-text").textContent=`Thí sinh: ${currentName}\nSố câu đúng: ${result.score}/${result.total}\nĐiểm số: ${grade}/10`;
  }catch(err){
    submitting=false; document.getElementById("submitBtn").disabled=false;
    document.getElementById("questions-area").textContent=err.message+" Vui lòng kiểm tra kết nối và thử nộp lại; không tải lại trang để tránh mất bài.";
  }
}
</script>
</body>
</html>
