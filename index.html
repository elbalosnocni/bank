<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hệ thống thi & khảo sát</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--brand:#2457c5}body{background:#f3f6fb;min-height:100vh;padding:18px 10px}.shell{max-width:900px;margin:auto;background:#fff;border-radius:18px;padding:clamp(16px,3vw,34px);box-shadow:0 8px 32px #14285012}.question-card{border:1px solid #e3e9f2;border-radius:13px;padding:18px;margin:16px 0;scroll-margin-top:150px}.question-card.invalid{border:2px solid #dc3545;background:#fffafa}.question-desc,.form-desc{color:#64748b;white-space:pre-line}.question-img{max-width:100%;max-height:300px;object-fit:contain;display:block;margin:12px auto;border-radius:8px}.option{display:block;padding:9px 11px;border-radius:8px;cursor:pointer}.option:hover{background:#f1f5ff}.sticky-head{position:sticky;top:0;z-index:50;background:#fff;padding:10px 0 12px;border-bottom:1px solid #e5eaf2}.sticky-head .progress{height:9px}.section-heading{background:#eef4ff;border-left:4px solid var(--brand);padding:16px;border-radius:10px;margin:24px 0 14px;scroll-margin-top:150px}.section-heading .desc{white-space:pre-line;color:#64748b}.error-note{font-size:.9rem;color:#b42318;margin-top:8px}.field-label{font-weight:600}.summary-answer{border-bottom:1px solid #e8edf4;padding:10px 0;text-align:left}.summary-answer small{color:#64748b}.timer{font-variant-numeric:tabular-nums}@media(max-width:575px){body{padding:8px 4px}.shell{border-radius:12px}.question-card{padding:13px}}
</style></head><body><main class="shell">
<section id="login-screen"><h2 class="text-center text-primary fw-bold">CỔNG THI & KHẢO SÁT</h2><p class="text-center text-secondary">Đăng nhập bằng số căn cước đã đăng ký</p><div id="login-alert" class="alert d-none"></div><label class="form-label fw-semibold" for="cccd">Số căn cước (12 chữ số)</label><div class="input-group mb-3"><input id="cccd" type="password" inputmode="numeric" maxlength="12" class="form-control form-control-lg" autocomplete="off" placeholder="Nhập 12 chữ số"><button class="btn btn-outline-secondary" type="button" id="toggleCccd">Hiện</button></div><button id="loginBtn" class="btn btn-primary btn-lg w-100">Xác thực</button></section>
<section id="subject-screen" class="d-none"><h3 class="text-primary">Xin chào, <span id="emp-name"></span></h3><p id="emp-meta" class="text-secondary"></p><div id="subject-alert" class="alert d-none"></div><label class="form-label fw-semibold">Chọn môn thi / khảo sát</label><select id="subject-select" class="form-select form-select-lg mb-3"></select><button id="startBtn" class="btn btn-primary btn-lg w-100">Bắt đầu</button></section>
<section id="exam-screen" class="d-none"><div class="sticky-head"><div class="d-flex justify-content-between align-items-center gap-2"><div><h4 id="exam-title" class="mb-1 fw-bold"></h4><div id="exam-mode" class="small text-secondary"></div></div><div id="timer" class="badge text-bg-danger p-2 timer d-none"></div></div><div id="form-description" class="form-desc small mt-2"></div><div class="d-flex justify-content-between small mt-2 mb-1"><span>Tiến độ trả lời</span><b id="progress-text">0/0</b></div><div class="progress"><div id="progress-bar" class="progress-bar" style="width:0%"></div></div></div><div id="validation-summary" class="alert alert-danger d-none mt-3"></div><div id="questions-area"></div><button id="submitBtn" class="btn btn-success btn-lg w-100 mt-3">Gửi bài / Kết thúc khảo sát</button></section>
<section id="result-screen" class="d-none"><div class="text-center py-3"><h2 class="text-success">Đã nộp bài thành công</h2><p id="result-message" class="text-secondary"></p><div id="result-score" class="alert alert-success"></div></div><h5>Thống kê câu trả lời</h5><div id="answer-summary"></div><button class="btn btn-outline-primary w-100 mt-3" onclick="location.reload()">Kết thúc / Quay về trang đầu</button></section>
</main><script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxD0yFGCV4pEVpChSkK_xlpdhBRJWZzRP5_WTXyr32HILn8BPNz87kVKMLOFZ0Lze-7/exec';
const GEO_DATA_URL='https://cdn.jsdelivr.net/gh/sunshine-tech/VietnamProvinces@main/vietnam_provinces/data/nested-divisions.json';
let employeeToken='',employee={},exams=[],examQuestions=[],examToken='',currentSubject='',timerInterval=null,submitting=false,geoData=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(payload){const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});if(!r.ok)throw Error('Không kết nối được máy chủ ('+r.status+').');return r.json()}
function alertBox(id,msg,type='danger'){const el=$(id);el.className='alert alert-'+type;el.textContent=msg;el.classList.remove('d-none')}
$('toggleCccd').onclick=()=>{$('cccd').type=$('cccd').type==='password'?'text':'password';$('toggleCccd').textContent=$('cccd').type==='password'?'Hiện':'Ẩn'};
$('loginBtn').onclick=async()=>{const c=$('cccd').value.trim();if(!/^\d{12}$/.test(c)){alertBox('login-alert','Vui lòng nhập đúng 12 chữ số căn cước.','warning');return}const b=$('loginBtn');b.disabled=true;b.textContent='Đang xác thực...';try{const d=await api({action:'employeeLookup',cccd:c});if(d.status!=='success')throw Error(d.message);employeeToken=d.employeeToken;employee=d.employee;exams=d.exams||[];$('emp-name').textContent=employee.hoTen;$('emp-meta').textContent=[employee.maNhanVien,employee.boPhan,employee.phongBan,employee.chucVu].filter(Boolean).join(' · ');$('subject-select').innerHTML='<option value="">-- Chọn môn --</option>'+exams.map((x,i)=>`<option value="${i}">${esc(x.monHoc)}${x.status==='OPEN'?'':' ('+esc(x.status)+')'}</option>`).join('');$('login-screen').classList.add('d-none');$('subject-screen').classList.remove('d-none');if(!exams.length)alertBox('subject-alert','Bạn hiện chưa được phân công môn thi/khảo sát nào.','warning')}catch(e){alertBox('login-alert',e.message)}finally{b.disabled=false;b.textContent='Xác thực'}};
$('startBtn').onclick=async()=>{const ix=$('subject-select').value;if(ix===''){alertBox('subject-alert','Vui lòng chọn môn thi/khảo sát.','warning');return}const chosen=exams[Number(ix)];if(chosen.status!=='OPEN'){alertBox('subject-alert','Môn này hiện không mở. Trạng thái: '+chosen.status,'warning');return}const b=$('startBtn');b.disabled=true;try{const d=await api({action:'getExam',monHoc:chosen.monHoc,employeeToken});if(d.status!=='success')throw Error(d.message);currentSubject=chosen.monHoc;examToken=d.token;examQuestions=d.questions||[];$('subject-screen').classList.add('d-none');$('exam-screen').classList.remove('d-none');$('exam-title').textContent=currentSubject;$('exam-mode').textContent=d.config.mode==='OPINION'?'Khảo sát – không chấm điểm':'Bài thi – có chấm điểm';$('form-description').textContent=d.config.description||'';renderQuestions();updateProgress();setupTimer(Number(d.config.thoiGian)||0)}catch(e){alertBox('subject-alert',e.message)}finally{b.disabled=false}};
function addImage(parent,url){if(!url)return;const im=document.createElement('img');im.src=url;im.alt='Hình minh họa';im.className='question-img';im.loading='lazy';parent.appendChild(im)}
function makeInput(q,card){const id=String(q.id),type=q.type,opts=q.options||[],settings=q.settings||{};const wrap=document.createElement('div');wrap.className='answer-wrap';
 const textInput=(kind='text')=>{const x=document.createElement(kind==='textarea'?'textarea':'input');if(kind!=='textarea')x.type=kind;x.className='form-control';x.dataset.qid=id;x.dataset.role='answer';if(type==='SHORT_TEXT'){x.maxLength=Number(settings.maxLength)||500;if(settings.inputType==='number'){x.inputMode='numeric';x.pattern='[0-9]*'}}wrap.appendChild(x)};
 if(type==='FILL_BLANK'||type==='SHORT_TEXT')textInput('text');
 else if(type==='ESSAY')textInput('textarea');
 else if(type==='DATE'||type==='TIME')textInput(type.toLowerCase());
 else if(type==='MULTIPLE_CHOICE'||type==='TRUE_FALSE')opts.forEach(o=>{const l=document.createElement('label');l.className='option';l.innerHTML=`<input class="form-check-input me-2" type="radio" name="q_${esc(id)}" data-qid="${esc(id)}" data-role="answer" value="${esc(o.value)}"> <b>${esc(o.value)}.</b> ${esc(o.text)}`;wrap.appendChild(l);addImage(wrap,o.image)});
 else if(type==='MULTI_SELECT')opts.forEach(o=>{const l=document.createElement('label');l.className='option';l.innerHTML=`<input class="form-check-input me-2" type="checkbox" data-qid="${esc(id)}" data-role="answer" value="${esc(o.value)}"> <b>${esc(o.value)}.</b> ${esc(o.text)}`;wrap.appendChild(l);addImage(wrap,o.image)});
 else if(type==='DROPDOWN'&&settings.geoType==='PROVINCE_WARD'){const p=document.createElement('select');p.className='form-select mb-2';p.dataset.qid=id;p.dataset.role='province';p.innerHTML='<option value="">Đang tải danh sách tỉnh/thành...</option>';const w=document.createElement('select');w.className='form-select';w.disabled=true;w.dataset.qid=id;w.dataset.role='ward';w.innerHTML='<option value="">Chọn tỉnh/thành trước</option>';wrap.append(p,w);loadGeo().then(data=>{p.innerHTML='<option value="">-- Chọn Tỉnh / Thành phố --</option>'+data.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('')}).catch(e=>{p.innerHTML='<option value="">Không tải được dữ liệu</option>';const err=document.createElement('div');err.className='error-note';err.textContent=e.message+' – Hãy tải lại trang hoặc kiểm tra kết nối.';wrap.appendChild(err)});p.onchange=()=>{const prov=geoData?.[Number(p.value)];w.innerHTML='<option value="">-- Chọn Xã / Phường --</option>';w.disabled=!prov;if(prov)(prov.wards||[]).forEach((x,i)=>{const op=document.createElement('option');op.value=String(i);op.textContent=x.name;w.appendChild(op)})};}
 else if(type==='DROPDOWN'){const x=document.createElement('select');x.className='form-select';x.dataset.qid=id;x.dataset.role='answer';x.innerHTML='<option value="">-- Chọn --</option>'+opts.map(o=>`<option value="${esc(o.value)}">${esc(o.text)}</option>`).join('');wrap.appendChild(x)}
 else if(type==='LINEAR_SCALE'||type==='RATING'){const min=type==='RATING'?1:Number(settings.min??1),max=type==='RATING'?Number(settings.max??5):Number(settings.max??5);const line=document.createElement('div');line.className='d-flex flex-wrap gap-3';for(let n=min;n<=max;n++){const l=document.createElement('label');l.className='text-center';l.innerHTML=`<input type="radio" class="form-check-input d-block mx-auto mb-1" name="q_${esc(id)}" data-qid="${esc(id)}" data-role="answer" value="${n}"><span>${type==='RATING'?'★':n}</span>`;line.appendChild(l)}wrap.appendChild(line);const cap=document.createElement('div');cap.className='d-flex justify-content-between small text-secondary mt-1';cap.innerHTML=`<span>${esc(settings.minLabel||'')}</span><span>${esc(settings.maxLabel||'')}</span>`;wrap.appendChild(cap)}
 else if(type==='MULTI_FIELD'){(q.fields||[]).forEach((f,i)=>{const l=document.createElement('label');l.className='form-label mt-2';l.textContent=f.label+(f.required?' *':'');const x=document.createElement('textarea');x.className='form-control';x.rows=2;x.dataset.qid=id;x.dataset.role='field';x.dataset.field='f'+i;wrap.append(l,x)});const no=document.createElement('label');no.className='option mt-2';no.innerHTML=`<input type="checkbox" class="form-check-input me-2" data-qid="${esc(id)}" data-role="no-opinion"> Tôi không có ý kiến`;wrap.appendChild(no);}
 else if(type==='MULTIPLE_CHOICE_GRID'||type==='CHECKBOX_GRID'){const rows=settings.rows||[];const table=document.createElement('div');table.className='table-responsive';const t=document.createElement('table');t.className='table table-bordered align-middle';t.innerHTML='<thead><tr><th></th>'+opts.map(o=>`<th>${esc(o.text)}</th>`).join('')+'</tr></thead>';const tb=document.createElement('tbody');rows.forEach((r,ri)=>{const tr=document.createElement('tr');tr.innerHTML=`<th>${esc(r)}</th>`+opts.map(o=>`<td class="text-center"><input type="${type==='CHECKBOX_GRID'?'checkbox':'radio'}" name="grid_${esc(id)}_${ri}" data-qid="${esc(id)}" data-role="grid" data-row="${ri}" value="${esc(o.value)}"></td>`).join('');tb.appendChild(tr)});t.append(thead,tb);table.appendChild(t);wrap.appendChild(table)}
 card.appendChild(wrap);
}
function renderQuestions(){const area=$('questions-area');area.innerHTML='';let num=0;examQuestions.forEach(q=>{if(q.isHeading||q.type==='SECTION'){const h=document.createElement('div');h.className='section-heading';const t=document.createElement('h5');t.className='mb-1 fw-bold';t.textContent=q.question;h.appendChild(t);if(q.description){const d=document.createElement('div');d.className='desc';d.textContent=q.description;h.appendChild(d)}area.appendChild(h);return}num++;const card=document.createElement('section');card.className='question-card';card.id='question-'+q.id;card.dataset.qid=q.id;const title=document.createElement('h5');title.className='fw-semibold';title.textContent=`Câu ${num}: ${q.question}`+(q.required===false?'':' *');card.appendChild(title);if(q.description){const d=document.createElement('div');d.className='question-desc mb-2';d.textContent=q.description;card.appendChild(d)}addImage(card,q.image);makeInput(q,card);const error=document.createElement('div');error.className='error-note d-none';error.dataset.error=q.id;card.appendChild(error);area.appendChild(card)});area.addEventListener('change',updateProgress);area.addEventListener('input',updateProgress)}
async function loadGeo(){if(geoData)return geoData;const r=await fetch(GEO_DATA_URL,{cache:'force-cache'});if(!r.ok)throw Error('Không tải được dữ liệu địa giới hành chính ('+r.status+').');const d=await r.json();if(!Array.isArray(d)||!d.length||!d[0].wards)throw Error('Cấu trúc dữ liệu Tỉnh/Xã không đúng định dạng dự kiến.');geoData=d;return d}
function getAnswer(q){const id=String(q.id),all=[...document.querySelectorAll(`[data-qid="${CSS.escape(id)}"]`)];if(q.type==='MULTI_FIELD'){const obj={};all.filter(x=>x.dataset.role==='field').forEach(x=>obj[x.dataset.field]=x.value.trim());obj.__noOpinion=!!all.find(x=>x.dataset.role==='no-opinion')?.checked;return obj}if(q.type==='DROPDOWN'&&q.settings?.geoType==='PROVINCE_WARD'){const p=all.find(x=>x.dataset.role==='province'),w=all.find(x=>x.dataset.role==='ward'),prov=geoData?.[Number(p?.value)],ward=prov?.wards?.[Number(w?.value)];return {province:prov?.name||'',provinceCode:prov?.code??'',ward:ward?.name||'',wardCode:ward?.code??''}}if(q.type==='MULTIPLE_CHOICE_GRID'||q.type==='CHECKBOX_GRID'){const obj={};(q.settings?.rows||[]).forEach((r,i)=>{obj['r'+i]=all.filter(x=>x.dataset.role==='grid'&&Number(x.dataset.row)===i&&x.checked).map(x=>x.value)});return obj}if(q.type==='MULTI_SELECT')return all.filter(x=>x.dataset.role==='answer'&&x.checked).map(x=>x.value);if(['MULTIPLE_CHOICE','TRUE_FALSE','LINEAR_SCALE','RATING'].includes(q.type))return all.find(x=>x.dataset.role==='answer'&&x.checked)?.value||'';return all.find(x=>x.dataset.role==='answer')?.value?.trim()||''}
function hasAnswer(q,a){if(q.type==='MULTI_FIELD')return a.__noOpinion||(q.fields||[]).some((f,i)=>String(a['f'+i]||'').trim());if(q.type==='MULTIPLE_CHOICE_GRID'||q.type==='CHECKBOX_GRID')return Object.values(a).some(v=>v.length);if(q.type==='DROPDOWN'&&q.settings?.geoType==='PROVINCE_WARD')return !!(a.province&&a.ward);if(Array.isArray(a))return a.length>0;return String(a??'').trim()!==''}
function updateProgress(){const qs=examQuestions.filter(q=>!q.isHeading&&q.type!=='SECTION'),done=qs.filter(q=>hasAnswer(q,getAnswer(q))).length,pct=qs.length?done/qs.length*100:0;$('progress-text').textContent=done+'/'+qs.length;$('progress-bar').style.width=pct+'%'}
function validateAll(){const errors=[];examQuestions.filter(q=>!q.isHeading&&q.type!=='SECTION').forEach(q=>{const a=getAnswer(q),card=$('question-'+q.id);let msg='';if(q.required!==false&&!hasAnswer(q,a))msg='Câu hỏi bắt buộc, vui lòng trả lời.';if(q.type==='MULTI_FIELD'&&!a.__noOpinion)(q.fields||[]).forEach((f,i)=>{if(f.required&&!String(a['f'+i]||'').trim())msg=msg||('Chưa điền mục bắt buộc: '+f.label)});if(q.type==='DROPDOWN'&&q.settings?.geoType==='PROVINCE_WARD'&&hasAnswer(q,a)&&!a.ward)msg='Vui lòng chọn Xã / Phường.';if(q.type==='SHORT_TEXT'&&a){const st=q.settings||{};if(st.inputType==='number'&&!/^\d+$/.test(a))msg='Chỉ được nhập chữ số.';else if(String(a).length>Number(st.maxLength||500))msg='Độ dài tối đa là '+(st.maxLength||500)+' ký tự.';else if(st.minValue!=null&&Number(a)<Number(st.minValue))msg='Giá trị tối thiểu là '+st.minValue+'.';else if(st.maxValue!=null&&Number(a)>Number(st.maxValue))msg='Giá trị tối đa là '+st.maxValue+'.'}if(msg)errors.push({id:q.id,question:q.question,message:msg,card})});return errors}
function showErrors(errors){document.querySelectorAll('.question-card').forEach(c=>c.classList.remove('invalid'));document.querySelectorAll('[data-error]').forEach(e=>{e.classList.add('d-none');e.textContent=''});errors.forEach(e=>{e.card.classList.add('invalid');const el=e.card.querySelector('[data-error]');el.textContent=e.message;el.classList.remove('d-none')});if(errors.length){$('validation-summary').textContent='Có '+errors.length+' câu cần kiểm tra. Hệ thống đã giữ nguyên câu trả lời; hãy sửa các câu được đánh dấu.';$('validation-summary').classList.remove('d-none');errors[0].card.scrollIntoView({behavior:'smooth',block:'center'})}else $('validation-summary').classList.add('d-none')}
function setupTimer(minutes){if(!minutes)return;$('timer').classList.remove('d-none');let left=minutes*60;const tick=()=>{$('timer').textContent='Còn '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(timerInterval);submitExam(true);return}left--};tick();timerInterval=setInterval(tick,1000)}
function answerLabel(q,a){if(q.type==='MULTI_FIELD')return a.__noOpinion?'Tôi không có ý kiến':(q.fields||[]).map((f,i)=>f.label+': '+(a['f'+i]||'')).join(' | ');if(q.type==='DROPDOWN'&&q.settings?.geoType==='PROVINCE_WARD')return [a.province,a.ward].filter(Boolean).join(' → ');if(q.type==='MULTI_SELECT')return a.map(v=>q.options.find(o=>o.value===v)?.text||v).join(', ');if(q.options?.length){const o=q.options.find(o=>o.value===a);if(o)return o.text}return typeof a==='object'?JSON.stringify(a):String(a||'Chưa trả lời')}
$('submitBtn').onclick=()=>submitExam(false);
async function submitExam(auto=false){if(submitting)return;const errs=auto?[]:validateAll();if(errs.length){showErrors(errs);return}if(!auto&&!confirm('Xác nhận kết thúc và gửi bài? Sau khi nộp, bạn không thể chỉnh sửa câu trả lời.'))return;submitting=true;$('submitBtn').disabled=true;$('submitBtn').textContent='Đang gửi bài...';const answers={},questionMeta={},summary=[];examQuestions.filter(q=>!q.isHeading&&q.type!=='SECTION').forEach(q=>{answers[q.id]=getAnswer(q);questionMeta[q.id]={question:q.question};summary.push({question:q.question,answer:answerLabel(q,answers[q.id])})});try{const d=await api({action:'submitExam',token:examToken,answers,questionMeta,autoSubmit:auto});if(d.status==='validation_error'){const mapped=(d.errors||[]).map(e=>({id:e.id,question:e.question,message:e.message,card:$('question-'+e.id)})).filter(e=>e.card);showErrors(mapped);submitting=false;$('submitBtn').disabled=false;$('submitBtn').textContent='Gửi bài / Kết thúc khảo sát';return}if(d.status!=='success')throw Error(d.message||'Không thể lưu bài.');if(timerInterval)clearInterval(timerInterval);$('exam-screen').classList.add('d-none');$('result-screen').classList.remove('d-none');$('result-message').textContent=d.message;$('result-score').textContent=d.mode==='GRADED'?`Số câu đúng: ${d.score}/${d.total} · Điểm: ${Number(d.diemSo||0).toFixed(2)}/10`:'Cảm ơn bạn đã hoàn thành khảo sát.';$('answer-summary').innerHTML=summary.map((x,i)=>`<div class="summary-answer"><b>${i+1}. ${esc(x.question)}</b><div>${esc(x.answer)}</div></div>`).join('')}catch(e){submitting=false;$('submitBtn').disabled=false;$('submitBtn').textContent='Gửi bài / Kết thúc khảo sát';alertBox('validation-summary',e.message+' Bài làm vẫn được giữ trên trang, bạn có thể thử gửi lại.');$('validation-summary').classList.remove('d-none')}}
</script></body></html>
